<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tip Pool</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tip Pool">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="theme-color" content="#f2f3f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/app.css">

<!-- Tailwind names for the colour tokens. The values live in css/app.css
     (:root for light; dark under prefers-color-scheme and [data-theme=dark]),
     so one class (bg-surface, text-ink-2, text-accent …) works in both themes.
     Same scheme as barlog. -->
<style type="text/tailwindcss">
@custom-variant dark (&:where([data-theme=dark], [data-theme=dark] *));
@theme inline {
  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-surface-2: var(--surface-2);
  --color-raised: var(--raised);
  --color-line: var(--line);
  --color-ink: var(--ink);
  --color-ink-2: var(--ink-2);
  --color-ink-3: var(--ink-3);
  --color-accent: var(--accent);
  --color-on-accent: var(--on-accent);
  --color-good: var(--good);
  --color-warn: var(--warn);
  --color-bad: var(--bad);
  /* roles */
  --color-bar: var(--bar);
  --color-srv: var(--srv);
  --color-sup: var(--sup);
  /* bill sizes — one tint per denomination, only for bills */
  --color-d100: var(--d100);
  --color-d50: var(--d50);
  --color-d20: var(--d20);
  --color-d10: var(--d10);
  --color-d5: var(--d5);
  --color-d1: var(--d1);
  --font-sans: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --radius-card: 1rem;
}
</style>
<!-- Tailwind v4 browser build, vendored: no CDN, no npm, no build step. -->
<script src="vendor/tailwind-browser-4.3.3.js"></script>
</head>
<body>

<header class="hdr">
  <button type="button" class="icon-btn" onclick="App.panel('left')" aria-label="Sessions and settings" aria-controls="drawer">
    <svg class="size-[1.125rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <!-- Small title: fades in once the page's big title scrolls away (html.scrolled) -->
  <span class="hdr-title t-head truncate" id="hdrTitle" aria-hidden="true">Payout</span>
  <!-- Date pill: opens this shift's panel (calendar, times, tools) -->
  <button type="button" class="hdr-pill" id="hdrDateBtn" onclick="App.panel('right')" aria-label="Shift date and settings" aria-controls="shiftPanel">
    <span class="truncate" id="hdrDateLabel">Today</span>
    <svg class="size-3.5 shrink-0 text-ink-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</header>
<input type="file" id="importFileInput" accept=".json,application/json" hidden onchange="App.importSession(this.files[0])">

<!-- Summary is home: the one page in the scroller. Pull down at its top for
     the hub (every page and tool); swipe sideways to change its view. -->
<main class="content" id="mainContent">
  <section class="panel active" id="tab-summary"><h1 class="page-title t-title">Summary</h1><div id="summary-root"></div></section>
</main>

<!-- Live HUD — Tips · Hours · Rate · Bills, each cell opens its page; two
     small pills on top (close time, chump) open their tools; swipe up opens
     the pages drawer (render/tabs.js) -->
<div class="hud is-empty" id="pipHud" role="group" aria-label="Live totals"></div>

<!-- Pages drawer (src/ui/pages.js): Staff · Tips · Payout rise from the
     bottom over Summary. Swipe sideways between them (the pages follow the
     finger), down on the head — or on a page scrolled to its top — to close. -->
<div class="pages-scrim" id="pagesScrim" onclick="App.tab('summary')"></div>
<section class="pages" id="pages" aria-hidden="true" aria-label="Pages">
  <div class="pages-head" id="pagesHead"></div>
  <div class="pages-view">
    <div class="pages-track" id="pagesTrack">
      <div class="pg" id="tab-staff"><div class="pg-scroll"><h1 class="page-title t-title">Staff</h1><div id="staff-root"></div></div></div>
      <div class="pg" id="tab-tips"><div class="pg-scroll"><h1 class="page-title t-title">Tips</h1><div id="tips-root"></div></div></div>
      <div class="pg" id="tab-payout"><div class="pg-scroll"><h1 class="page-title t-title">Payout</h1><div id="payout-root"></div></div></div>
    </div>
  </div>
</section>

<!-- Hub (src/ui/pages.js): pull down at the top of Summary — every page and tool -->
<div class="hub-scrim" id="hubScrim" onclick="App.hub(false)"></div>
<section class="hub" id="hub" aria-hidden="true" aria-label="Go to"></section>

<!-- Side panels (src/ui/panels.js): left = sessions + app settings
     (render/drawer.js), right = this shift (render/shiftpanel.js) -->
<div class="side-scrim" id="panelScrim" onclick="App.closePanels()"></div>
<aside class="side side--left" id="drawer" aria-label="Sessions and settings" aria-hidden="true">
  <div class="side-head">
    <img src="icon-192.png" alt="" class="size-10 rounded-xl">
    <div class="min-w-0 flex-1">
      <div class="t-title truncate">Tip Pool</div>
      <div class="t-small truncate text-ink-3">Sessions and settings</div>
    </div>
    <button type="button" class="icon-btn" onclick="App.closePanels()" aria-label="Close">
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </div>
  <div class="side-body" id="drawer-body"></div>
</aside>
<aside class="side side--right" id="shiftPanel" aria-label="This shift" aria-hidden="true">
  <div class="side-head">
    <button type="button" class="icon-btn" onclick="App.closePanels()" aria-label="Close">
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="min-w-0 flex-1">
      <div class="t-title truncate">This shift</div>
      <div class="t-small truncate text-ink-3" id="shift-sub">&nbsp;</div>
    </div>
  </div>
  <div class="side-body" id="shift-body"></div>
</aside>

<!-- Time keypad (src/ui/keypad.js): docks at the bottom while a time cell is active -->
<div class="keypad" id="keypad" aria-label="Time keypad"></div>

<!-- Bottom sheets are mounted here from src/ui/sheet.js -->
<div id="sheets"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
