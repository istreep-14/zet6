<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tip Pool</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tip Pool">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="theme-color" content="#f2f3f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/app.css">

<!-- Tailwind names for the colour tokens. The values live in css/app.css
     (:root for light; dark under prefers-color-scheme and [data-theme=dark]),
     so one class (bg-surface, text-ink-2, text-accent …) works in both themes.
     Same scheme as barlog. -->
<style type="text/tailwindcss">
@custom-variant dark (&:where([data-theme=dark], [data-theme=dark] *));
@theme inline {
  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-surface-2: var(--surface-2);
  --color-raised: var(--raised);
  --color-line: var(--line);
  --color-ink: var(--ink);
  --color-ink-2: var(--ink-2);
  --color-ink-3: var(--ink-3);
  --color-accent: var(--accent);
  --color-on-accent: var(--on-accent);
  --color-good: var(--good);
  --color-money: var(--money);
  --color-warn: var(--warn);
  --color-bad: var(--bad);
  /* roles */
  --color-bar: var(--bar);
  --color-srv: var(--srv);
  --color-sup: var(--sup);
  /* bill sizes — one tint per denomination, only for bills */
  --color-d100: var(--d100);
  --color-d50: var(--d50);
  --color-d20: var(--d20);
  --color-d10: var(--d10);
  --color-d5: var(--d5);
  --color-d1: var(--d1);
  --font-sans: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --radius-card: 1rem;
}
</style>
<!-- Tailwind v4 browser build, vendored: no CDN, no npm, no build step. -->
<script src="vendor/tailwind-browser-4.3.3.js"></script>
</head>
<body>

<!-- Header (render/tabs.js), one row: the page's sub-tabs; on a subpage
     Back · its title · its actions. -->
<header class="hdr" id="hdr"></header>
<input type="file" id="importFileInput" accept=".json,application/json" hidden onchange="App.importSession(this.files[0])">

<!-- The stage: the four tab pages, and the subpages pushed
     over them from the right (src/ui/nav.js). Tabs change only from the tab
     bar; a sideways swipe moves between a page's sub-tabs (the header), and a
     swipe right on a subpage goes back. -->
<div class="stage">
  <main class="content" id="mainContent">
    <section class="panel active" id="tab-home"><div id="home-root"></div></section>
    <section class="panel" id="tab-staff"><div id="staff-root"></div></section>
    <section class="panel" id="tab-tips"><div id="tips-root"></div><div id="payout-root"></div></section>
    <section class="panel" id="tab-settings"><div id="settings-root"></div></section>
  </main>
  <div class="subpages" id="subpages"></div>
</div>

<!-- Bottom tabs (render/tabs.js keeps the active one and the badges) -->
<nav class="tabbar">
  <button class="tab" id="tb-home" onclick="App.tabTap('home')">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>
    <span class="tab-label">Home</span><span class="tab-sub" id="tab-sub-home"></span>
  </button>
  <button class="tab" id="tb-staff" onclick="App.tabTap('staff')">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
    <span class="tab-label">Staff</span><span class="tab-sub" id="tab-sub-staff"></span>
  </button>
  <button class="tab" id="tb-tips" onclick="App.tabTap('tips')">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>
    <span class="tab-label">Tips</span><span class="tab-sub" id="tab-sub-tips"></span>
  </button>
  <button class="tab" id="tb-settings" onclick="App.tabTap('settings')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    <span class="tab-label">Settings</span><span class="tab-sub" id="tab-sub-settings"></span>
  </button>
</nav>

<!-- Time keypad (src/ui/keypad.js): docks at the bottom while a time cell is active -->
<div class="keypad" id="keypad" aria-label="Time keypad"></div>

<!-- Bottom sheets are mounted here from src/ui/sheet.js -->
<div id="sheets"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
