<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tip Pool</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tip Pool">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="css/app.css">

<!-- Design tokens. Every colour / font / radius here becomes a Tailwind
     utility (bg-surface, text-ink-2, text-gold, rounded-card, font-rounded …)
     and a CSS variable (--color-surface …) that css/app.css can use. -->
<style type="text/tailwindcss">
@theme static {
  /* surfaces, darkest → lightest */
  --color-bg: #000000;
  --color-surface: #121215;     /* cards (opaque: swipe rows + sticky cells match it) */
  --color-raised: #1e1e23;      /* cards inside sheets, pressed rows, table footers */
  --color-high: #2e2e34;        /* selected segment, active chip */
  --color-fill: rgb(130 130 145 / .22);     /* inputs, tonal buttons */
  --color-fill-2: rgb(130 130 145 / .12);
  --color-sep: rgb(255 255 255 / .08);
  --color-edge: rgb(255 255 255 / .09);     /* glass hairline around cards */

  /* text */
  --color-ink: #ffffff;
  --color-ink-2: rgb(235 235 245 / .7);
  --color-ink-3: rgb(235 235 245 / .4);

  /* accent: gold = active + primary; green = rate; red = closers + errors */
  --color-gold: #ffd23f;
  --color-gold-ink: #1a1300;
  --color-red: #ff453a;
  --color-red-soft: #ff8a80;
  --color-green: #30d158;
  --color-amber: #ff9f0a;

  /* roles */
  --color-bar: #ff9f0a;
  --color-srv: #3d9bff;
  --color-sup: #c77dff;

  /* bill sizes — one tint per denomination, only for bills */
  --color-d100: #5fd4a8;
  --color-d50: #ff8fa3;
  --color-d20: #8fd16a;
  --color-d10: #f0a35e;
  --color-d5: #a99bf7;
  --color-d1: #9aa7b3;

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --font-rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

  --radius-card: 20px;
}
</style>
<!-- Tailwind v4 browser build, vendored: no CDN, no npm, no build step. -->
<script src="vendor/tailwind-browser-4.3.3.js"></script>
</head>
<body>

<header class="hdr">
  <button type="button" class="hdr-menu" onclick="App.panel('left')" aria-label="Sessions and settings" aria-controls="drawer">
    <svg class="size-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <h1 class="hdr-title truncate font-bold" id="hdrTitle">Payout</h1>
  <!-- Date pill: opens this shift's panel (calendar, times, tools) -->
  <button type="button" class="hdr-date-btn" id="hdrDateBtn" onclick="App.panel('right')" aria-label="Shift date and settings" aria-controls="shiftPanel">
    <svg class="size-4 text-ink-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <span id="hdrDateLabel">Today</span>
    <svg class="-mr-1 size-4 text-ink-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</header>
<input type="file" id="importFileInput" accept=".json,application/json" hidden onchange="App.importSession(this.files[0])">

<!-- Each tab's content is rendered by its module in src/render/. -->
<main class="content" id="mainContent">
  <section class="panel" id="tab-summary"><div class="subtabs" id="subtabs-summary"></div><div class="sub-root" id="summary-root"></div></section>
  <section class="panel" id="tab-staff"><div class="subtabs" id="subtabs-staff"></div><div class="sub-root" id="staff-root"></div></section>
  <section class="panel" id="tab-tips"><div class="subtabs" id="subtabs-tips"></div><div class="sub-root" id="tips-root"></div></section>
  <section class="panel" id="tab-payout"><div class="subtabs" id="subtabs-payout"></div><div class="sub-root" id="payout-root"></div></section>
</main>

<!-- Live HUD — rate / pool / chump while editing Staff & Tips -->
<button class="hud is-empty" id="pipHud" onclick="App.tab('summary')" aria-label="Open summary"></button>

<nav class="tabbar">
  <button class="tab" id="tb-summary" onclick="App.tab('summary')">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>
    <span class="tab-label">Summary</span><span class="tab-sub" id="tab-sub-summary"></span>
  </button>
  <button class="tab" id="tb-staff" onclick="App.tab('staff')">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
    <span class="tab-label">Staff</span><span class="tab-sub" id="tab-sub-staff"></span>
  </button>
  <button class="tab" id="tb-tips" onclick="App.tab('tips')">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>
    <span class="tab-label">Tips</span><span class="tab-sub" id="tab-sub-tips"></span>
  </button>
  <button class="tab" id="tb-payout" onclick="App.tab('payout')">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
    <span class="tab-label">Payout</span><span class="tab-sub" id="tab-sub-payout"></span>
  </button>
</nav>

<!-- Side panels (src/ui/panels.js): left = sessions + app settings
     (render/drawer.js), right = this shift (render/shiftpanel.js) -->
<div class="side-scrim" id="panelScrim" onclick="App.closePanels()"></div>
<aside class="side side--left" id="drawer" aria-label="Sessions and settings" aria-hidden="true">
  <div class="side-head">
    <img src="icon-192.png" alt="" class="size-9 rounded-[10px]">
    <div class="min-w-0 flex-1">
      <div class="truncate text-[22px] font-extrabold leading-none tracking-[-.03em]">Tip Pool</div>
      <div class="mt-1 text-[12px] font-semibold uppercase tracking-[.09em] text-ink-3">Sessions &amp; settings</div>
    </div>
    <button type="button" class="grid size-11 place-items-center" onclick="App.closePanels()" aria-label="Close">
      <span class="grid size-8 place-items-center rounded-full bg-fill text-ink-2"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></span>
    </button>
  </div>
  <div class="side-body" id="drawer-body"></div>
</aside>
<aside class="side side--right" id="shiftPanel" aria-label="This shift" aria-hidden="true">
  <div class="side-head">
    <button type="button" class="grid size-11 place-items-center" onclick="App.closePanels()" aria-label="Close">
      <span class="grid size-8 place-items-center rounded-full bg-fill text-ink-2"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>
    <div class="min-w-0 flex-1">
      <div class="truncate text-[22px] font-extrabold leading-none tracking-[-.03em]">This shift</div>
      <div class="mt-1 truncate text-[12px] font-semibold uppercase tracking-[.09em] text-ink-3" id="shift-sub">&nbsp;</div>
    </div>
  </div>
  <div class="side-body" id="shift-body"></div>
</aside>

<!-- Bottom sheets are mounted here from src/ui/sheet.js -->
<div id="sheets"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
