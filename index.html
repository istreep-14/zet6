<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tip Pool</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tip Pool">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="theme-color" content="#0b0b10">
<link rel="stylesheet" href="css/app.css">

<!-- Design tokens. Every colour / font / radius here becomes a Tailwind
     utility (bg-surface, text-ink-2, text-gold, rounded-card, font-rounded …)
     and a CSS variable (--color-surface …) that css/app.css can use. -->
<style type="text/tailwindcss">
@theme static {
  /* surfaces, darkest → lightest */
  --color-bg: #0b0b10;
  --color-surface: #18181d;     /* cards */
  --color-raised: #24242a;      /* cards inside sheets, pressed rows */
  --color-high: #33333a;        /* selected segment, active chip */
  --color-fill: rgb(120 120 135 / .24);     /* inputs, tonal buttons */
  --color-fill-2: rgb(120 120 135 / .13);
  --color-sep: rgb(84 84 92 / .55);

  /* text */
  --color-ink: #ffffff;
  --color-ink-2: rgb(235 235 245 / .62);
  --color-ink-3: rgb(235 235 245 / .34);

  /* accent: gold = active + primary; green = rate; red = closers + errors */
  --color-gold: #f5c842;
  --color-gold-ink: #1d1600;
  --color-red: #ff453a;
  --color-red-soft: #ff8a80;
  --color-green: #30d158;
  --color-amber: #ff9f0a;

  /* roles */
  --color-bar: #ff9f0a;
  --color-srv: #3d9bff;
  --color-sup: #c77dff;

  /* bill sizes — one tint per denomination, only for bills */
  --color-d100: #5fd4a8;
  --color-d50: #ff8fa3;
  --color-d20: #8fd16a;
  --color-d10: #f0a35e;
  --color-d5: #a99bf7;
  --color-d1: #9aa7b3;

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --font-rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

  --radius-card: 22px;
}
</style>
<!-- Tailwind v4 browser build, vendored: no CDN, no npm, no build step. -->
<script src="vendor/tailwind-browser-4.3.3.js"></script>
</head>
<body>

<header class="hdr">
  <h1 class="hdr-title truncate font-bold" id="hdrTitle">Payout</h1>
  <input type="date" class="hdr-date" id="tipDate" onchange="App.setDate(this.value)" aria-label="Shift date">
  <button class="grid size-10 shrink-0 place-items-center rounded-full bg-fill text-ink-2 active:bg-high" onclick="App.openSettings()" aria-label="Settings">
    <svg class="size-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
  </button>
</header>
<input type="file" id="importFileInput" accept=".json,application/json" hidden onchange="App.importSession(this.files[0])">

<!-- Each tab's content is rendered by its module in src/render/. -->
<main class="content" id="mainContent">
  <section class="panel" id="tab-staff"><div id="staff-root"></div></section>
  <section class="panel" id="tab-tips"><div id="tips-root"></div></section>
  <section class="panel" id="tab-payout"><div id="payout-root"></div></section>
</main>

<!-- Live HUD — rate / pool / chump while editing Staff & Tips -->
<button class="hud is-empty" id="pipHud" onclick="App.tab('payout')" aria-label="Open payout"></button>

<nav class="tabbar">
  <button class="tab" id="tb-staff" onclick="App.tab('staff')">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
    <span class="tab-label">Staff</span><span class="tab-sub" id="tab-sub-staff"></span>
  </button>
  <button class="tab" id="tb-tips" onclick="App.tab('tips')">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>
    <span class="tab-label">Tips</span><span class="tab-sub" id="tab-sub-tips"></span>
  </button>
  <button class="tab" id="tb-payout" onclick="App.tab('payout')">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
    <span class="tab-label">Payout</span><span class="tab-sub" id="tab-sub-payout"></span>
  </button>
</nav>

<!-- Bottom sheets are mounted here from src/ui/sheet.js -->
<div id="sheets"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
